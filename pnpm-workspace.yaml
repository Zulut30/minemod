packages:
  - packages/*
  - apps/*

linkWorkspacePackages: true
engineStrict: true
overrides:
  '@typescript-eslint/tsconfig-utils': 8.63.0
  '@typescript-eslint/types': 8.63.0
  body-parser: 2.3.0
  fast-uri: 3.1.8
  hono: 4.13.7
  ip-address: 10.7.1
  brace-expansion: 5.0.12
  '@hono/node-server': 1.19.15
  qs: 6.16.0
saveExact: true
sharedWorkspaceLockfile: true
verifyDepsBeforeRun: false

allowBuilds:
  esbuild: true
